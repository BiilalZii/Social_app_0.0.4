{% extends "base.html" %}
{% block title %}{{ 'تعديل نشاط' if t else 'نشاط جديد' }}{% endblock %}
{% block content %}
<h4 class="mb-3">{{ 'تعديل: ' + t.Type_Activity if t else 'إضافة نشاط جديد' }}</h4>
<div class="card p-4" style="max-width:450px">
    <form method="post">
        {% if not t %}
        <div class="mb-3">
            <label class="form-label">اسم النشاط *</label>
            <input type="text" name="type_activity" class="form-control" placeholder="مثال: عيد المرأة، خرجة سياحية..." required>
        </div>
        {% endif %}
        <div class="mb-3">
            <label class="form-label">المستحق المالي</label>
            <input type="number" step="0.01" name="value" class="form-control" value="{{ t.Value if t else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">تاريخ النشاط (اختياري)</label>
            <input type="date" name="activity_date" class="form-control" value="{{ t.Activity_Date if t else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">الوصف</label>
            <input type="text" name="description" class="form-control" value="{{ t.Description if t else '' }}">
        </div>
        <button type="submit" class="btn btn-primary">حفظ</button>
        <a href="{{ url_for('activity_types') }}" class="btn btn-secondary">إلغاء</a>
    </form>
</div>
{% endblock %}
