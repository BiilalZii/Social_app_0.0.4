{% extends "base.html" %}
{% block title %}{{ 'تعديل نوع منحة' if t else 'نوع منحة جديد' }}{% endblock %}
{% block content %}
<h4 class="mb-3">{{ 'تعديل: ' + t.Type_AIDE if t else 'إضافة نوع منحة جديد' }}</h4>
<div class="card p-4" style="max-width:400px">
    <form method="post">
        {% if not t %}
        <div class="mb-3">
            <label class="form-label">اسم نوع المنحة *</label>
            <input type="text" name="type_aide" class="form-control" placeholder="مثال: زواج الموظف" required>
        </div>
        {% endif %}
        <div class="mb-3">
            <label class="form-label">القيمة الافتراضية</label>
            <input type="number" step="0.01" name="value" class="form-control" value="{{ t.Value if t else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">الوصف</label>
            <input type="text" name="description" class="form-control" value="{{ t.Description if t else '' }}">
        </div>
        <button type="submit" class="btn btn-primary">حفظ</button>
        <a href="{{ url_for('aide_types') }}" class="btn btn-secondary">إلغاء</a>
    </form>
</div>
{% endblock %}
